version: '3.8'

services:
  backend:
    image: ${ACR_NAME}.azurecr.io/damagescope-backend:latest
    container_name: damagescope-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/backend/data
      - UPLOAD_DIR=/backend/uploads
      - MODELS_DIR=/backend/models
      - ALLOWED_ORIGINS=*

  frontend:
    image: ${ACR_NAME}.azurecr.io/damagescope-frontend:latest
    container_name: damagescope-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
